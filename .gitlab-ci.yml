stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "1.0"
  # IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  REMOTE_DIR: "/home/project/meko-academy-front-office"  

build-image:
  stage: build
  image: docker:latest
  tags:
    - front

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock

  before_script:
    - mkdir -p /etc/docker/certs.d/registry.meko.ac
    - echo "$CERT_CA" > /etc/docker/certs.d/registry.meko.ac/ca.crt
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    - echo "tafiditra ato"

  script:
    - docker build -t "$IMAGE_DOCKER:$IMAGE_TAG" .
    - echo "Pushing image to registry..."
    - docker push "$IMAGE_DOCKER:$IMAGE_TAG"

  only:
    - develop

deploy-k8s:
  stage: deploy
  image:  alpine:latest
  tags:
    - front
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/ssh_key
    - chmod 600 ~/.ssh/ssh_key
    - ssh-keyscan ${SSH_IP} >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "tafiditra ato"  
  script:
    - |
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/ssh_key $SSH_USER@$SSH_IP <<EOF
        echo $REGISTRY_PASS | docker login $REGISTRY_HOST -u $REGISTRY_USER --password-stdin
        cd ${REMOTE_DIR} &&
        ls
        # echo '$REGISTRY_PASS' | microk8s ctr images pull $IMAGE_DOCKER:$IMAGE_TAG --user $REGISTRY_USER:$REGISTRY_PASS 
        echo "ready for deployment"
        microk8s kubectl apply -f deploy.yml
        microk8s kubectl rollout restart deployment frontoffice-meko 
        microk8s  kubectl rollout status deployment/frontoffice-meko  --timeout=120s
        # microk8s kubectl apply -f /home/$SSH_USER/manifests/front.yaml"
        EOF
  only:
    - develop
  
