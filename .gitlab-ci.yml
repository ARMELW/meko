stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  REMOTE_DIR: "/home/project/meko-academy-front-office"  

build-image:
  stage: build
  image: docker:latest 
  tags:
    - front

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock

  before_script:
    - mkdir -p /etc/docker/certs.d/registry.meko.ac
    - echo "$CERT_CA" > /etc/docker/certs.d/registry.meko.ac/ca.crt
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    - echo "tafiditra ato"

  script:
    - docker build -t "$IMAGE_DOCKER:$IMAGE_TAG" .
    - echo "Pushing image to registry..."
    - echo ""$CI_REGISTRY_PASSWORD:$IMAGE_TAG""
    # - docker push "$IMAGE_DOCKER:$IMAGE_TAG"

