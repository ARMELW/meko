stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  REMOTE_DIR: "/home/project/meko-academy-front-office"
  DOCKER_REGISTRY: "$REGISTRY_HOST"
  IMAGE_NAME: "$IMAGE_NAME:$IMAGE_TAG"

build-image:
  stage: build
  # image: docker:latest
  tags:
    - front
    
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - mkdir -p /etc/docker/certs.d/$DOCKER_REGISTRY
    - echo "$CERT_CA" > /etc/docker/certs.d/$DOCKER_REGISTRY/ca.crt
    - echo "$REGISTRY_PASS" | docker login "$DOCKER_REGISTRY" -u "$REGISTRY_USER" --password-stdin
  script:
    |
     echo "Building Docker image:"" $IMAGE_NAME"
     docker build -t "$IMAGE_NAME" . 
     echo "📦 Pushing image to registry..."
     docker push "$IMAGE_NAME"
  only:
    - develop

deploy-k8s:
  stage: deploy
  image: alpine:latest
  tags:
    - front
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/ssh_key
    - chmod 600 ~/.ssh/ssh_key
    - ssh-keyscan -H $SSH_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      echo "🔐 Connecting to remote server to deploy..."
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/ssh_key $SSH_USER@$SSH_IP <<EOF
        set -e

        echo "$REGISTRY_PASS" | docker login $DOCKER_REGISTRY -u $REGISTRY_USER --password-stdin
        cd "$REMOTE_DIR" || exit 1       

        echo "📄 Replacing image tag in deployment manifest..."
        sed -i "s|image: .*|image: $IMAGE_NAME|" deploy.yml
        cat deploy.yml
        
        echo "🚀 Deploying updated front..."
        microk8s kubectl apply -f deploy.yml

        echo "✅ Deployment successful."
        docker images --format '{{.Repository}} {{.ID}}' |grep '^registry.meko.ac/meko-academy-front-office' | awk '{print $2}' | xargs -r docker rmi -f # effacement ciblé des images in'util generer par docker pour le repos meko-backend
        docker buildx prune -f # effacement des caches
      EOF
  only: 
    - develop
