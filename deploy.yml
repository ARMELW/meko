apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-fo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meko-fo
  template:
    metadata:
      labels:
        app: meko-fo
    spec:
      containers:
        - name: meko-fo
          image: registry.meko.ac/frontoffice-meko:1.0
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
      imagePullSecrets:
        - name: nexus-registry-secret  # Même secret que pour le backend
---
apiVersion: v1
kind: Service
metadata:
  name: meko-fo-service
spec:
  selector:
    app: meko-fo
  type: NodePort
  ports:
    - port: 5173       # Port dans le cluster
      targetPort: 5173 # Port dans le conteneur
      nodePort: 30173  # Port sur la machine physique (host)
