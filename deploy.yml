apiVersion: apps/v1
kind: Deployment
metadata:
  name: meko-fo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meko-fo
  template:
    metadata:
      labels:
        app: meko-fo
    spec:
      containers:
        - name: meko-fo
          image: registry.meko.ac/frontoffice-meko:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4173
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
      imagePullSecrets:
        - name: nexus-registry-secret  # Même secret que pour le backend
---
apiVersion: v1
kind: Service
metadata:
  name: meko-fo-service
spec:
  selector:
    app: meko-fo
  type: ClusterIP
  ports:
    - port: 4173       # Port dans le cluster
      targetPort: 4173 # Port dans le conteneur
---
# ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev.meko.ac
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - dev.meko.ac
    secretName: dev.meko.ac-tls
  rules:
  - host: dev.meko.ac
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meko-fo-service
            port:
              number: 4173
  
