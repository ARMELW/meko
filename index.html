<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meko Academy</title>
    <style>
      body {
        margin: 0;
        background-color: #0A1B3D;
      }
      
      #root {
        min-height: 100vh;
      }

      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0A1B3D;
        z-index: 9999;
      }

      .initial-loader img {
        width: 120px;
        height: auto;
        margin-bottom: 20px;
      }

      .dots-loader {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #7EDAFD;
        border-radius: 50%;
        animation: dotPulse 1.4s infinite ease-in-out;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotPulse {
        0%, 100% { 
          transform: scale(0.3);
          opacity: 0.3;
        }
        50% { 
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img src="/logo.svg" alt="Meko Academy" />
        <div class="dots-loader">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
